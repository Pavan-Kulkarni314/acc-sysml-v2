name: Validate SysML v2 model

on:
  push:
    paths: ["model/**", "tools/**", "scripts/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pilot implementation
        uses: actions/cache@v4
        with:
          path: |
            .pilot/sysml.jar
            .pilot/sysml.library
          key: sysml-pilot-0.63.1

      - name: Install SysML v2 pilot implementation
        run: bash scripts/setup_pilot.sh

      - name: Validate model
        run: bash scripts/validate.sh
