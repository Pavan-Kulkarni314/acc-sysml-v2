@startuml
skin sysmlc
skinparam wrapWidth 300
hide circle
skinparam ranksep 8

rec usage "~<TC-07> brakeOverrideTest" as E1  << verification>> [[psysml:cde13cb5-2782-4986-9ddb-43dd61d4099a ]] {
rec usage "applyBrake" as E4  <<(T,blue) action>> [[psysml:87a80a40-3a04-40b9-93cc-0197db464ef2 ]] {
}

rec usage "measureReaction" as E6  <<(T,blue) action>> [[psysml:14bd0832-4a8b-4f46-a967-3c286e9638a1 ]] {
portout "reactionTime" as E8  [[psysml:bbcf6945-3669-4f29-9d78-8f0adddc5cf7 ]] 
}

rec usage "evaluate" as E9  <<(T,blue) action>> [[psysml:ff424154-0732-4a6a-bf6d-c20a24fdd74d ]] {
portin "reactionTime" as E10  [[psysml:f8e2613f-74c9-414d-ad60-bae4ee56ac52 ]] 
portout "verdict" as E11  [[psysml:d862ebad-2d5b-4c79-a250-595b8bd2b5de ]] 
}

portout "verdict" as E12  [[psysml:c7d6f614-9084-418d-97e2-36e151c22d94 ]] 
}

note as E2
[[psysml:25a63601-c17e-4ee9-ac78-d7e4a558f7db @]]HIL: with ACC active at 80 km/h, send a brake pedal signal and measure the time until the ACC state is standby.
end note 
note as E3
""           ""[[psysml:83c9d6ac-44af-4546-82e9-2304b24dba3b «metadata»]]
==== ""        ""VerificationMethod
- -
kind =  VerificationMethodKind::test
end note
note as E5
[[psysml:4d895783-2320-4451-a98b-cd8384dcd4f1 @]]Send "brake pedal pressed" on the vehicle bus at time t0.
end note 
note as E7
[[psysml:fcbc4aaf-46d5-4386-83f3-25d2621d05dd @]]Log the time from t0 until the ACC state signal shows standby.
